name: Cluster Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cluster:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Syntax check
        run: find src tests/cluster -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Cross-node presence + broadcast validation
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php tests/cluster/validate.php
